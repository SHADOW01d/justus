<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💌 Just Us</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --rose: #e8789a;
    --rose-dark: #c4567a;
    --rose-glow: rgba(232,120,154,0.18);
    --gold: #e8c87a;
    --bg: #0d0a0f;
    --bg2: #161118;
    --bg3: #1e1525;
    --surface: #221929;
    --surface2: #2a1f33;
    --text: #f0e8f0;
    --text2: #a892b4;
    --text3: #6b5578;
    --border: rgba(232,120,154,0.12);
    --shadow: 0 4px 32px rgba(0,0,0,0.6);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  /* ── CHAT CONTAINER ── */
  .chat-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--bg);
  }

  /* ── HEADER ── */
  .chat-header {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 1rem 1.2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .chat-header-left {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .back-btn {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0.4rem;
    border-radius: 8px;
    transition: background 0.2s;
  }

  .back-btn:hover { background: var(--surface2); }

  .room-info {
    display: flex;
    flex-direction: column;
  }

  .room-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--text);
    font-weight: 500;
  }

  .room-code {
    font-size: 0.75rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .partner-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--rose-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
  }

  /* ── MESSAGES AREA ── */
  .messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }

  .message {
    display: flex;
    gap: 0.6rem;
    max-width: 80%;
    animation: slideIn 0.3s ease-out;
  }

  .system-message {
    text-align: center;
    color: var(--text3);
    font-size: 0.8rem;
    font-style: italic;
    margin: 0.5rem 0;
    padding: 0.5rem;
    background: var(--surface2);
    border-radius: 12px;
    max-width: 200px;
    margin-left: auto;
    margin-right: auto;
  }

  .message.own {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .message-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .message-content {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    padding: 0.8rem 1rem;
    position: relative;
  }

  .message.own .message-content {
    background: linear-gradient(135deg, var(--rose-dark), var(--rose));
    border: none;
    color: white;
  }

  .message-text {
    font-size: 0.95rem;
    line-height: 1.4;
    word-wrap: break-word;
  }

  .message-time {
    font-size: 0.75rem;
    color: var(--text3);
    margin-top: 0.3rem;
  }

  .message.own .message-time {
    color: rgba(255,255,255,0.7);
  }

  .read-receipt {
    font-size: 0.7rem;
    color: var(--text3);
    margin-top: 0.2rem;
    font-style: italic;
  }

  /* ── TYPING INDICATOR ── */
  .typing-indicator {
    padding: 0.8rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    color: var(--text2);
    font-style: italic;
  }

  .typing-dots {
    display: flex;
    gap: 0.2rem;
  }

  .typing-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text2);
    animation: typingAnimation 1.4s infinite ease-in-out;
  }

  .typing-dot:nth-child(1) { animation-delay: 0s; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingAnimation {
    0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
    30% { opacity: 1; transform: scale(1); }
  }

  /* ── MOBILE RESPONSIVENESS ── */
  @media (max-width: 768px) {
    .chat-header {
      padding: 0.8rem 1rem;
    }

    .chat-header-title {
      font-size: 1.1rem;
    }

    .messages-area {
      padding: 0.8rem;
      gap: 0.6rem;
    }

    .message {
      max-width: 90%;
      gap: 0.5rem;
    }

    .message-avatar {
      width: 24px;
      height: 24px;
      font-size: 0.8rem;
    }

    .message-content {
      padding: 0.6rem 0.8rem;
    }

    .message-text {
      font-size: 0.9rem;
    }

    .message-time {
      font-size: 0.7rem;
    }

    .typing-indicator {
      padding: 0.6rem 0.8rem;
      font-size: 0.8rem;
    }

    .input-area {
      padding: 0.8rem;
      gap: 0.6rem;
      min-height: 80px;
    }

    .message-input {
      font-size: 0.9rem;
      padding: 0.6rem;
    }

    .emoji-btn {
      font-size: 1.2rem;
      padding: 0.5rem;
    }

    .file-btn {
      font-size: 1.1rem;
      padding: 0.5rem;
    }

    .send-btn {
      font-size: 0.9rem;
      padding: 0.6rem 1rem;
    }

  /* Mobile-specific fixes */
  @media (max-width: 768px) {
    .input-area {
      padding: 0.6rem;
      min-height: 70px;
    }
    
    .message-input {
      font-size: 16px; /* Prevents zoom on iOS */
      padding: 0.5rem;
    }
    
    .emoji-btn, .file-btn, .voice-btn {
      font-size: 0.9rem;
      padding: 0.3rem;
    }
  }

    .attachment-image {
      max-width: 150px;
    }

    .image-download-btn {
      width: 36px;
      height: 36px;
      font-size: 16px;
      bottom: 6px;
      right: 6px;
    }

    .voice-btn {
      font-size: 1.1rem;
      padding: 0.5rem;
    }

    .audio-container {
      max-width: 240px;
    }
  }

  @media (max-width: 480px) {
    .chat-header {
      padding: 0.6rem 0.8rem;
    }

    .chat-header-title {
      font-size: 1rem;
    }

    .messages-area {
      padding: 0.6rem;
      gap: 0.5rem;
    }

    .message {
      max-width: 95%;
      gap: 0.4rem;
    }

    .message-avatar {
      width: 20px;
      height: 20px;
      font-size: 0.7rem;
    }

    .message-content {
      padding: 0.5rem 0.7rem;
    }

    .message-text {
      font-size: 0.85rem;
    }

    .input-area {
      padding: 0.6rem;
      gap: 0.5rem;
    }

    .message-input {
      font-size: 0.85rem;
      padding: 0.5rem;
    }

    .emoji-btn {
      font-size: 1.1rem;
      padding: 0.4rem;
    }

    .file-btn {
      font-size: 1rem;
      padding: 0.4rem;
    }

    .send-btn {
      font-size: 0.85rem;
      padding: 0.5rem 0.8rem;
    }

    .attachment-image {
      max-width: 120px;
    }

    .image-download-btn {
      width: 40px;
      height: 40px;
      font-size: 18px;
      bottom: 4px;
      right: 4px;
      opacity: 1; /* Always visible on mobile for better UX */
    }

    .voice-btn {
      font-size: 1rem;
      padding: 0.4rem;
    }

    .audio-container {
      max-width: 200px;
    }

    .voice-trash-btn, .voice-send-btn {
      width: 36px;
      height: 36px;
    }

    .voice-waveform {
      height: 20px;
    }

    .voice-timer {
      font-size: 0.9rem;
    }

    .voice-note-container {
      max-width: 260px;
    }
  }

  /* ── INPUT AREA ── */
  .input-area {
    background: var(--surface);
    border-top: 0.5px solid var(--border);
    padding: 1rem;
    display: flex;
    gap: 0.8rem;
    align-items: flex-end;
    flex-shrink: 0;
    min-height: 80px;
    position: sticky;
    bottom: 0;
    z-index: 10;
  }

  .emoji-btn {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0.3rem;
    border-radius: 8px;
    transition: background 0.2s;
  }

  .emoji-btn:hover { background: var(--surface2); }

  .file-btn {
    background: none;
    border: none;
    font-size: 0.9rem;
    padding: 0.3rem;
    cursor: pointer;
  } 
  .file-btn {
    border-radius: 50%;
    transition: all 0.2s ease;
    color: var(--text2);
  }

  .file-btn:hover { background: var(--surface2); }

  .voice-btn {
    background: none;
    border: none;
    font-size: 1.3rem;
    padding: 0.6rem;
    cursor: pointer;
    border-radius: 50%;
    transition: all 0.2s ease;
    color: var(--text2);
  }

  .voice-btn:hover { background: var(--surface2); }
  .voice-btn.recording { 
    background: var(--rose); 
    color: white; 
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  .message-input-wrapper {
    flex: 1;
    position: relative;
  }

  .message-input {
    width: 100%;
    background: var(--bg3);
    border: 0.5px solid var(--border);
    border-radius: 20px;
    padding: 0.8rem 1rem;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
    min-height: 44px;
    max-height: 120px;
  }

  .message-input:focus { border-color: var(--rose); }
  .message-input::placeholder { color: var(--text3); }

  .send-btn {
    background: linear-gradient(135deg, var(--rose-dark), var(--rose));
    color: white;
    border: none;
    padding: 0.7rem 1.2rem;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s ease;
  }

  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── FILE UPLOAD PROGRESS ── */
  .upload-progress {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin: 0.5rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .upload-info {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text2);
    font-size: 0.9rem;
  }

  .upload-spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--text3);
    border-top: 2px solid var(--rose);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* ── FILE ATTACHMENTS ── */
  .message-attachment {
    margin-top: 0.5rem;
    border-radius: 8px;
    overflow: hidden;
    max-width: 100%;
  }

  .image-container {
    position: relative;
    display: inline-block;
  }

  .attachment-image {
    width: 100%;
    max-width: 200px;
    height: auto;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .attachment-image:hover {
    transform: scale(1.02);
  }

  .image-download-btn {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    opacity: 0;
  }

  .image-container:hover .image-download-btn {
    opacity: 1;
  }

  .image-download-btn:hover {
    background: rgba(0, 0, 0, 0.9);
    transform: scale(1.1);
  }

  .attachment-document {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem;
    background: var(--bg3);
    border-radius: 8px;
    text-decoration: none;
    color: var(--text);
    transition: background 0.2s ease;
  }

  .attachment-document:hover {
    background: var(--surface2);
  }

  .attachment-icon {
    font-size: 1.2rem;
  }

  .attachment-info {
    flex: 1;
  }

  .attachment-name {
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 0.1rem;
  }

  .attachment-size {
    font-size: 0.75rem;
    color: var(--text3);
  }

  /* ── INPUT AREA WITH VOICE RECORDING ── */
  .input-area {
    background: var(--surface);
    border-top: 0.5px solid var(--border);
    padding: 1rem;
    display: flex;
    gap: 0.8rem;
    align-items: flex-end;
  }

  .input-normal {
    display: flex;
    gap: 0.8rem;
    align-items: flex-end;
    width: 100%;
  }

  .input-voice-recording {
    display: flex;
    align-items: center;
    gap: 1rem;
    width: 100%;
    padding: 0.5rem 0;
  }

  .voice-recording-content {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .voice-waveform {
    display: flex;
    gap: 0.2rem;
    align-items: center;
    height: 24px;
  }

  .waveform-bar {
    width: 3px;
    background: var(--rose);
    border-radius: 2px;
    animation: input-waveform 1s ease-in-out infinite;
  }

  .waveform-bar:nth-child(1) { height: 12px; animation-delay: 0s; }
  .waveform-bar:nth-child(2) { height: 20px; animation-delay: 0.1s; }
  .waveform-bar:nth-child(3) { height: 24px; animation-delay: 0.2s; }
  .waveform-bar:nth-child(4) { height: 20px; animation-delay: 0.3s; }
  .waveform-bar:nth-child(5) { height: 16px; animation-delay: 0.4s; }
  .waveform-bar:nth-child(6) { height: 12px; animation-delay: 0.5s; }
  .waveform-bar:nth-child(7) { height: 8px; animation-delay: 0.6s; }

  @keyframes input-waveform {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  .voice-timer {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-width: 40px;
  }

  .voice-trash-btn, .voice-send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .voice-trash-btn {
    background: var(--surface2);
    color: var(--text3);
  }

  .voice-trash-btn:hover {
    background: var(--bg3);
    color: var(--text);
  }

  .voice-send-btn {
    background: var(--rose);
    color: white;
  }

  .voice-send-btn:hover {
    background: var(--rose-dark);
    transform: scale(1.05);
  }

  .voice-send-btn:active {
    transform: scale(0.95);
  }

  /* ── WHATSAPP-STYLE VOICE NOTE PLAYER ── */
  .voice-note-container {
    max-width: 300px;
  }

  .voice-note-player {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--bg3);
    border-radius: 20px;
    padding: 0.8rem 1rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .voice-note-player:hover {
    background: var(--surface2);
  }

  .voice-play-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--rose);
    border: none;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .voice-play-btn:hover {
    background: var(--rose-dark);
    transform: scale(1.05);
  }

  .voice-play-btn:active {
    transform: scale(0.95);
  }

  .voice-note-info {
    flex: 1;
    min-width: 0;
  }

  .voice-note-title {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 0.2rem;
  }

  .voice-note-duration {
    font-size: 0.75rem;
    color: var(--text3);
  }

  .voice-note-waveform {
    display: flex;
    align-items: center;
    gap: 0.1rem;
    height: 24px;
    margin-left: 0.5rem;
  }

  .waveform-bar-small {
    width: 2px;
    background: var(--text3);
    border-radius: 1px;
    transition: all 0.2s ease;
  }

  .voice-note-waveform.playing .waveform-bar-small {
    background: var(--rose);
    animation: voice-waveform-play 1s ease-in-out infinite;
  }

  .voice-note-waveform.playing .waveform-bar-small:nth-child(odd) {
    animation-delay: 0.1s;
  }

  .voice-note-waveform.playing .waveform-bar-small:nth-child(even) {
    animation-delay: 0.2s;
  }

  @keyframes voice-waveform-play {
    0%, 100% { transform: scaleY(0.5); }
    50% { transform: scaleY(1); }
  }

  /* ── TOAST NOTIFICATIONS ── */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface);
    color: var(--text);
    padding: 0.8rem 1.2rem;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    border: 0.5px solid var(--border);
    font-size: 0.9rem;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 1001;
    max-width: 300px;
    text-align: center;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ── EMOJI PICKER ── */
  .emoji-picker {
    position: absolute;
    bottom: 60px;
    left: 0;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 0.8rem;
    display: none;
    box-shadow: var(--shadow);
    z-index: 100;
    width: 320px;
    max-height: 400px;
    overflow: hidden;
  }

  .emoji-picker.show { display: block; }

  .emoji-tabs {
    display: flex;
    gap: 0.2rem;
    margin-bottom: 0.8rem;
    overflow-x: auto;
    border-bottom: 0.5px solid var(--border);
    padding-bottom: 0.5rem;
  }

  .emoji-tab {
    background: none;
    border: none;
    color: var(--text3);
    font-size: 0.75rem;
    cursor: pointer;
    padding: 0.4rem 0.6rem;
    border-radius: 6px;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .emoji-tab:hover { 
    background: var(--surface); 
    color: var(--text2);
  }

  .emoji-tab.active {
    background: var(--rose);
    color: white;
  }

  .emoji-grid-container {
    height: 280px;
    overflow-y: auto;
  }

  .emoji-grid {
    display: none;
    grid-template-columns: repeat(8, 1fr);
    gap: 0.2rem;
  }

  .emoji-grid.active { display: grid; }

  .emoji-option {
    background: none;
    border: none;
    font-size: 0.9rem;
    padding: 0.3rem;
    border-radius: 8px;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 32px;
  }

  .emoji-option:hover { 
    background: var(--surface); 
    transform: scale(1.1);
  }

  /* ── TYPING INDICATOR ── */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    color: var(--text3);
    font-size: 0.85rem;
    font-style: italic;
  }

  .typing-dots {
    display: flex;
    gap: 0.2rem;
  }

  .typing-dot {
    width: 4px;
    height: 4px;
    background: var(--text3);
    border-radius: 50%;
    animation: typing 1.4s infinite;
  }

function initializeEmojiPicker() {
  const picker = document.getElementById('emoji-picker');
  
  // Create category tabs
  const tabsContainer = document.createElement('div');
  tabsContainer.className = 'emoji-tabs';
  
  Object.keys(emojiCategories).forEach((category, index) => {
    const tab = document.createElement('button');
    tab.className = 'emoji-tab';
    tab.textContent = category;
    tab.onclick = () => showEmojiCategory(category);
    if (index === 0) tab.classList.add('active');
    tabsContainer.appendChild(tab);
  });
  
  // Create emoji grid container
  const gridContainer = document.createElement('div');
  gridContainer.className = 'emoji-grid-container';
  
  Object.keys(emojiCategories).forEach(category => {
    const grid = document.createElement('div');
    grid.className = 'emoji-grid';
    grid.id = `emoji-${category.replace(/\s+/g, '-').toLowerCase()}`;
    
    emojiCategories[category].forEach(emoji => {
      const btn = document.createElement('button');
      btn.className = 'emoji-option';
      btn.textContent = emoji;
      btn.onclick = () => addEmoji(emoji);
      grid.appendChild(btn);
    });
    
    gridContainer.appendChild(grid);
  });
  
  // Show first category by default
  const firstGrid = gridContainer.querySelector('.emoji-grid');
  if (firstGrid) firstGrid.classList.add('active');
  
  picker.appendChild(tabsContainer);
  picker.appendChild(gridContainer);
}

function showEmojiCategory(category) {
  // Hide all grids
  document.querySelectorAll('.emoji-grid').forEach(grid => {
    grid.classList.remove('active');
  });
  
  // Remove active class from all tabs
  document.querySelectorAll('.emoji-tab').forEach(tab => {
    tab.classList.remove('active');
  });
  
  // Show selected grid
  const targetGrid = document.getElementById(`emoji-${category.replace(/\s+/g, '-').toLowerCase()}`);
  if (targetGrid) targetGrid.classList.add('active');
  
  // Add active class to clicked tab
  event.target.classList.add('active');
}

function loadMessages() {
  fetch(`/chat/get_messages/${state.roomCode}/`)
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        state.messages = data.messages;
        state.partnerName = data.partner_name;
        state.partnerAvatar = data.partner_avatar;
        updatePartnerInfo();
        renderMessages();
        
        // Show who you're chatting with
        updatePartnerDisplay();
      }
    });
}

function updatePartnerInfo() {
  const avatarEl = document.getElementById('partner-avatar');
  avatarEl.textContent = state.partnerAvatar;
  const typingName = document.getElementById('typing-name');
  typingName.textContent = state.partnerName;
}

function updatePartnerDisplay() {
  const partnerDisplay = document.getElementById('partner-display');
  if (state.partnerName && state.partnerName !== 'Anonymous') {
    partnerDisplay.textContent = `You are with ${state.partnerName}`;
  } else {
    partnerDisplay.textContent = 'Waiting for someone to join...';
  }
}

// ── POLLING (TEMPORARY SOLUTION) ──
function connectWebSocket() {
  console.log('Using HTTP polling for chat (WebSocket disabled for testing)');
  // Start polling for new messages every 3 seconds
  state.pollingInterval = setInterval(() => {
    pollMessages();
  }, 3000);
}

function pollMessages() {
  fetch(`/chat/get_messages/${state.roomCode}/`)
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        // Update partner info if it changed
        if (data.partner_name !== state.partnerName || data.partner_avatar !== state.partnerAvatar) {
          state.partnerName = data.partner_name;
          state.partnerAvatar = data.partner_avatar;
          updatePartnerInfo();
          updatePartnerDisplay();
        }
        
        // Update typing indicators
        updateTypingIndicator(data.typing_users);
        
        // Check if there are new messages
        const currentMessageIds = state.messages.map(m => m.id);
        const newMessages = data.messages.filter(m => !currentMessageIds.includes(m.id));
        
        if (newMessages.length > 0) {
          newMessages.forEach(msg => {
            state.messages.push(msg);
            addMessageToList(msg);
          });
        }
        
        // Mark messages as read
        markMessagesAsRead();
      }
    })
    .catch(error => {
      console.error('Error polling messages:', error);
    });
}

function handleWebSocketMessage(data) {
  switch (data.type) {
    case 'message':
      addMessage(data.message, false);
      break;
    case 'typing':
      showTypingIndicator(data.is_typing);
      break;
    case 'partner_info':
      state.partnerName = data.name;
      state.partnerAvatar = data.avatar;
      updatePartnerInfo();
      break;
  }
}

// ── MESSAGING ──
function sendMessage() {
  const input = document.getElementById('message-input');
  const text = input.value.trim();
  
  if (!text) return;

  const message = {
    text: text,
    timestamp: new Date().toISOString()
  };

  // Send via HTTP POST
  fetch(`/chat/send_message/${state.roomCode}/`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      text: text,
      timestamp: message.timestamp
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      // Clear input and refresh messages
      input.value = '';
      autoResize(input);
      pollMessages(); // Immediately poll to get the new message
    } else {
      showToast('Error sending message');
    }
  })
  .catch(error => {
    showToast('Network error sending message');
    console.error('Send message error:', error);
  });
}

function addMessage(message, isOwn) {
  state.messages.push({...message, is_own: isOwn});
  renderMessages();
}

function addMessageToList(message) {
  const container = document.getElementById('messages-area');
  const messageEl = createMessageElement(message);
  container.appendChild(messageEl);
  
  // Scroll to bottom
  container.scrollTop = container.scrollHeight;
}

function updateTypingIndicator(typingUsers) {
  const typingEl = document.getElementById('typing-indicator');
  const typingNameEl = document.getElementById('typing-name');
  
  if (typingUsers && typingUsers.length > 0) {
    typingNameEl.textContent = typingUsers[0];
    typingEl.style.display = 'flex';
  } else {
    typingEl.style.display = 'none';
  }
}

function markMessagesAsRead() {
  // Mark last 10 messages as read (to avoid too many requests)
  const recentMessages = state.messages.slice(-10).filter(msg => !msg.is_own);
  recentMessages.forEach(msg => {
    fetch(`/chat/mark_read/${state.roomCode}/`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message_id: msg.id
      })
    }).catch(error => {
      console.error('Error marking message as read:', error);
    });
  });
}

function handleTyping() {
  const input = document.getElementById('message-input');
  const text = input.value.trim();
  
  // Clear existing timeout
  if (state.typingTimeout) {
    clearTimeout(state.typingTimeout);
  }
  
  if (text.length > 0) {
    if (!state.isTyping) {
      state.isTyping = true;
      sendTypingIndicator(true);
    }
    
    // Set timeout to stop typing indicator after 3 seconds of inactivity
    state.typingTimeout = setTimeout(() => {
      state.isTyping = false;
      sendTypingIndicator(false);
    }, 3000);
  } else {
    if (state.isTyping) {
      state.isTyping = false;
      sendTypingIndicator(false);
    }
  }
}

function sendTypingIndicator(isTyping) {
  fetch(`/chat/typing/${state.roomCode}/`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      is_typing: isTyping
    })
  }).catch(error => {
    console.error('Error sending typing indicator:', error);
  });
}

// ── FILE UPLOAD ──
function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  // Validate file size (10MB max)
  const maxSize = 10 * 1024 * 1024;
  if (file.size > maxSize) {
    showToast('File too large. Maximum size is 10MB');
    event.target.value = '';
    return;
  }
  
  // Validate file type
  const allowedTypes = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'pdf', 'doc', 'docx', 'txt'];
  const fileExtension = file.name.split('.').pop().toLowerCase();
  
  if (!allowedTypes.includes(fileExtension)) {
    showToast('File type not allowed. Please upload images or documents.');
    event.target.value = '';
    return;
  }
  
  // Show upload progress
  showUploadProgress(file.name);
  
  // Create FormData for file upload
  const formData = new FormData();
  formData.append('file', file);
  
  // Upload file
  fetch(`/chat/upload_file/${state.roomCode}/`, {
    method: 'POST',
    body: formData
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      hideUploadProgress();
      showToast(`File uploaded: ${data.filename}`);
      
      // Refresh messages to show the uploaded file
      pollMessages();
    } else {
      hideUploadProgress();
      showToast(`Upload failed: ${data.error}`);
    }
  })
  .catch(error => {
    hideUploadProgress();
    showToast('Network error uploading file');
    console.error('File upload error:', error);
  })
  .finally(() => {
    // Clear the file input
    event.target.value = '';
  });
}

function showUploadProgress(filename) {
  const progressHtml = `
    <div class="upload-progress" id="upload-progress">
      <div class="upload-info">
        <span>Uploading ${filename}...</span>
        <div class="upload-spinner"></div>
      </div>
    </div>
  `;
  
  // Insert progress indicator after input area
  const inputArea = document.querySelector('.input-area');
  inputArea.insertAdjacentHTML('afterend', progressHtml);
}

function hideUploadProgress() {
  const progressEl = document.getElementById('upload-progress');
  if (progressEl) {
    progressEl.remove();
  }
}

// ── WHATSAPP-STYLE VOICE RECORDING ──
let voiceRecordingStartTime = null;
let voiceRecordingTimer = null;

async function toggleVoiceRecording() {
  if (state.isRecording) {
    stopVoiceRecording();
  } else {
    startVoiceRecording();
  }
}

async function startVoiceRecording() {
  try {
    // Request microphone access
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    
    // Initialize MediaRecorder
    state.mediaRecorder = new MediaRecorder(stream);
    state.audioChunks = [];
    voiceRecordingStartTime = Date.now();
    
    // Set up event handlers
    state.mediaRecorder.ondataavailable = (event) => {
      state.audioChunks.push(event.data);
    };
    
    state.mediaRecorder.onstop = () => {
      // This will be called when recording stops
      console.log('Recording stopped, audio chunks collected:', state.audioChunks.length);
    };
    
    // Start recording
    state.mediaRecorder.start();
    state.isRecording = true;
    
    // Update UI - switch to voice recording mode
    const voiceBtn = document.getElementById('voice-btn');
    voiceBtn.classList.add('recording');
    
    const inputNormal = document.getElementById('input-normal');
    const inputVoiceRecording = document.getElementById('input-voice-recording');
    
    inputNormal.style.display = 'none';
    inputVoiceRecording.style.display = 'flex';
    
    // Start timer
    updateVoiceTimer();
    voiceRecordingTimer = setInterval(updateVoiceTimer, 1000);
    
  } catch (error) {
    console.error('Error accessing microphone:', error);
    showToast('Microphone access denied. Please allow microphone access to record voice notes.');
  }
}

function stopVoiceRecording() {
  if (state.mediaRecorder && state.isRecording) {
    state.mediaRecorder.stop();
    state.mediaRecorder.stream.getTracks().forEach(track => track.stop());
    state.isRecording = false;
    
    // Clear timer
    if (voiceRecordingTimer) {
      clearInterval(voiceRecordingTimer);
      voiceRecordingTimer = null;
    }
    
    // Update UI
    const voiceBtn = document.getElementById('voice-btn');
    voiceBtn.classList.remove('recording');
    
    // Reset timer display
    document.getElementById('voice-timer').textContent = '0:00';
  }
}

function cancelVoiceRecording() {
  stopVoiceRecording();
  
  // Switch back to normal input mode
  const inputNormal = document.getElementById('input-normal');
  const inputVoiceRecording = document.getElementById('input-voice-recording');
  
  inputNormal.style.display = 'flex';
  inputVoiceRecording.style.display = 'none';
  
  // Clear audio chunks
  state.audioChunks = [];
  voiceRecordingStartTime = null;
}

async function sendVoiceRecording() {
  console.log('Send voice recording called, audio chunks:', state.audioChunks.length);
  
  if (!state.audioChunks.length) {
    showToast('No audio recorded');
    return;
  }
  
  // Stop recording first
  stopVoiceRecording();
  
  // Wait a moment for the recording to fully stop
  await new Promise(resolve => setTimeout(resolve, 100));
  
  console.log('Creating audio blob from', state.audioChunks.length, 'chunks');
  
  // Create audio blob
  const audioBlob = new Blob(state.audioChunks, { type: 'audio/webm' });
  console.log('Audio blob created, size:', audioBlob.size);
  
  // Create file from blob
  const audioFile = new File([audioBlob], `voice_note_${Date.now()}.webm`, { type: 'audio/webm' });
  console.log('Audio file created:', audioFile.name, 'size:', audioFile.size);
  
  // Create FormData for upload
  const formData = new FormData();
  formData.append('file', audioFile);
  
  // Switch back to normal input mode
  const inputNormal = document.getElementById('input-normal');
  const inputVoiceRecording = document.getElementById('input-voice-recording');
  
  inputNormal.style.display = 'flex';
  inputVoiceRecording.style.display = 'none';
  
  // Show upload progress
  showUploadProgress('Voice note...');
  
  // Upload voice note
  try {
    const response = await fetch(`/chat/upload_file/${state.roomCode}/`, {
      method: 'POST',
      body: formData
    });
    
    const data = await response.json();
    
    if (data.success) {
      hideUploadProgress();
      showToast('Voice note sent successfully');
      
      // Refresh messages to show the voice note
      pollMessages();
    } else {
      hideUploadProgress();
      showToast(`Upload failed: ${data.error}`);
    }
  } catch (error) {
    hideUploadProgress();
    showToast('Network error uploading voice note');
    console.error('Voice note upload error:', error);
  }
  
  // Clear audio chunks
  state.audioChunks = [];
  voiceRecordingStartTime = null;
}

function updateVoiceTimer() {
  if (voiceRecordingStartTime) {
    const elapsed = Math.floor((Date.now() - voiceRecordingStartTime) / 1000);
    const minutes = Math.floor(elapsed / 60);
    const seconds = elapsed % 60;
    const display = `${minutes}:${seconds.toString().padStart(2, '0')}`;
    document.getElementById('voice-timer').textContent = display;
  }
}

function renderMessages() {
  const container = document.getElementById('messages-area');
  container.innerHTML = '';

  state.messages.forEach(msg => {
    const messageEl = createMessageElement(msg);
    container.appendChild(messageEl);
  });

  // Scroll to bottom
  container.scrollTop = container.scrollHeight;
}

function createMessageElement(message) {
  const div = document.createElement('div');
  
  // Handle system messages differently
  if (message.sender_name === 'System') {
    div.className = 'system-message';
    div.textContent = message.text;
    return div;
  }
  
  div.className = `message ${message.is_own ? 'own' : ''}`;

  const avatar = document.createElement('div');
  avatar.className = 'message-avatar';
  avatar.textContent = message.is_own ? state.myAvatar : state.partnerAvatar;

  const content = document.createElement('div');
  content.className = 'message-content';

  const text = document.createElement('div');
  text.className = 'message-text';
  text.textContent = message.text;

  // Add file attachments if any
  if (message.attachments && message.attachments.length > 0) {
    const attachmentsContainer = document.createElement('div');
    attachmentsContainer.className = 'message-attachments';
    
    message.attachments.forEach(attachment => {
      const attachmentEl = createAttachmentElement(attachment);
      attachmentsContainer.appendChild(attachmentEl);
    });
    
    content.appendChild(attachmentsContainer);
  }

  const time = document.createElement('div');
  time.className = 'message-time';
  time.textContent = message.formatted_time || formatTime(message.timestamp);

  // Add read receipt for own messages
  if (message.is_own && message.read_by && message.read_by.length > 0) {
    const readReceipt = document.createElement('div');
    readReceipt.className = 'read-receipt';
    readReceipt.textContent = `Read by ${message.read_by.join(', ')}`;
    content.appendChild(readReceipt);
  }

  content.appendChild(text);
  content.appendChild(time);

  div.appendChild(avatar);
  div.appendChild(content);

  return div;
}

function createAttachmentElement(attachment) {
  const container = document.createElement('div');
  container.className = 'message-attachment';
  
  if (attachment.is_image) {
    const imageContainer = document.createElement('div');
    imageContainer.className = 'image-container';
    
    const img = document.createElement('img');
    img.className = 'attachment-image';
    img.src = attachment.file_url;
    img.alt = attachment.filename;
    img.onclick = () => window.open(attachment.file_url, '_blank');
    
    const downloadBtn = document.createElement('button');
    downloadBtn.className = 'image-download-btn';
    downloadBtn.innerHTML = '⬇';
    downloadBtn.title = 'Download image';
    downloadBtn.onclick = (e) => {
      e.stopPropagation();
      downloadImage(attachment.file_url, attachment.filename);
    };
    
    imageContainer.appendChild(img);
    imageContainer.appendChild(downloadBtn);
    container.appendChild(imageContainer);
  } else if (attachment.is_audio) {
    const voiceNoteContainer = document.createElement('div');
    voiceNoteContainer.className = 'voice-note-container';
    
    const voiceNotePlayer = document.createElement('div');
    voiceNotePlayer.className = 'voice-note-player';
    
    const playButton = document.createElement('button');
    playButton.className = 'voice-play-btn';
    playButton.innerHTML = `
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M8 5V19L19 12L8 5Z" fill="currentColor"/>
      </svg>
    `;
    
    const voiceInfo = document.createElement('div');
    voiceInfo.className = 'voice-note-info';
    
    const voiceTitle = document.createElement('div');
    voiceTitle.className = 'voice-note-title';
    voiceTitle.textContent = 'Voice Note';
    
    const voiceDuration = document.createElement('div');
    voiceDuration.className = 'voice-note-duration';
    voiceDuration.textContent = attachment.file_size;
    
    voiceInfo.appendChild(voiceTitle);
    voiceInfo.appendChild(voiceDuration);
    
    const waveform = document.createElement('div');
    waveform.className = 'voice-note-waveform';
    for (let i = 0; i < 20; i++) {
      const bar = document.createElement('div');
      bar.className = 'waveform-bar-small';
      bar.style.height = `${Math.random() * 20 + 10}px`;
      waveform.appendChild(bar);
    }
    
    voiceNotePlayer.appendChild(playButton);
    voiceNotePlayer.appendChild(voiceInfo);
    voiceNotePlayer.appendChild(waveform);
    
    // Create hidden audio element for actual playback
    const audioElement = document.createElement('audio');
    audioElement.src = attachment.file_url;
    audioElement.preload = 'metadata';
    
    // Add play/pause functionality
    let isPlaying = false;
    
    playButton.addEventListener('click', () => {
      if (isPlaying) {
        audioElement.pause();
        playButton.innerHTML = `
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M8 5V19L19 12L8 5Z" fill="currentColor"/>
          </svg>
        `;
        waveform.classList.remove('playing');
      } else {
        audioElement.play();
        playButton.innerHTML = `
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <rect x="6" y="4" width="4" height="16" fill="currentColor"/>
            <rect x="14" y="4" width="4" height="16" fill="currentColor"/>
          </svg>
        `;
        waveform.classList.add('playing');
      }
      isPlaying = !isPlaying;
    });
    
    audioElement.addEventListener('ended', () => {
      playButton.innerHTML = `
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M8 5V19L19 12L8 5Z" fill="currentColor"/>
        </svg>
      `;
      waveform.classList.remove('playing');
      isPlaying = false;
    });
    
    voiceNoteContainer.appendChild(voiceNotePlayer);
    voiceNoteContainer.appendChild(audioElement);
    container.appendChild(voiceNoteContainer);
  } else {
    const link = document.createElement('a');
    link.className = 'attachment-document';
    link.href = attachment.file_url;
    link.target = '_blank';
    link.download = attachment.filename;
    
    const icon = document.createElement('span');
    icon.className = 'attachment-icon';
    icon.textContent = getFileIcon(attachment.file_type);
    
    const info = document.createElement('div');
    info.className = 'attachment-info';
    
    const name = document.createElement('div');
    name.className = 'attachment-name';
    name.textContent = attachment.filename;
    
    const size = document.createElement('div');
    size.className = 'attachment-size';
    size.textContent = attachment.file_size;
    
    info.appendChild(name);
    info.appendChild(size);
    
    link.appendChild(icon);
    link.appendChild(info);
    container.appendChild(link);
  }
  
  return container;
}

function downloadImage(url, filename) {
  // Create a temporary link element to trigger download
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.target = '_blank';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  
  // Show success message
  showToast('Image download started');
}

// ── TOAST NOTIFICATIONS ──
function showToast(message) {
  // Remove existing toast if any
  const existingToast = document.querySelector('.toast');
  if (existingToast) {
    existingToast.remove();
  }
  
  // Create toast element
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  
  // Add to body
  document.body.appendChild(toast);
  
  // Trigger animation
  setTimeout(() => toast.classList.add('show'), 10);
  
  // Remove after 3 seconds
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => {
      if (toast.parentNode) {
        toast.parentNode.removeChild(toast);
      }
    }, 300);
  }, 3000);
}

function getFileIcon(fileType) {
  const iconMap = {
    'pdf': '📄',
    'doc': '📝',
    'docx': '📝',
    'txt': '📃',
    'jpg': '🖼️',
    'jpeg': '🖼️',
    'png': '🖼️',
    'gif': '🖼️',
    'webp': '🖼️',
    'mp3': '🎵',
    'wav': '🎵',
    'ogg': '🎵',
    'm4a': '🎵',
    'aac': '🎵',
    'webm': '🎵'
  };
  return iconMap[fileType.toLowerCase()] || '📎';
}

function getAudioMimeType(fileType) {
  const mimeMap = {
    'mp3': 'audio/mpeg',
    'wav': 'audio/wav',
    'ogg': 'audio/ogg',
    'm4a': 'audio/mp4',
    'aac': 'audio/aac',
    'webm': 'audio/webm'
  };
  return mimeMap[fileType.toLowerCase()] || 'audio/webm';
}

function formatTime(timestamp) {
  const date = new Date(timestamp);
  return date.toLocaleTimeString('en-US', { 
    hour: 'numeric', 
    minute: '2-digit',
    hour12: true 
  });
}

// ── TYPING INDICATOR ──
let typingTimeout;
function handleKeyPress(event) {
  const input = event.target;
  
  // Send typing indicator
  clearTimeout(typingTimeout);
  state.ws.send(JSON.stringify({
    type: 'typing',
    is_typing: true
  }));

  typingTimeout = setTimeout(() => {
    state.ws.send(JSON.stringify({
      type: 'typing',
      is_typing: false
    }));
  }, 1000);

  // Send message on Enter
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function showTypingIndicator(isTyping) {
  const indicator = document.getElementById('typing-indicator');
  indicator.style.display = isTyping ? 'flex' : 'none';
}

// ── EMOJI PICKER ──
function toggleEmojiPicker() {
  const picker = document.getElementById('emoji-picker');
  picker.classList.toggle('show');
}

function addEmoji(emoji) {
  console.log('Adding emoji:', emoji); // Debug log
  const input = document.getElementById('message-input');
  console.log('Input element:', input); // Debug log
  
  if (!input) {
    console.error('Message input not found');
    return;
  }
  
  const start = input.selectionStart;
  const end = input.selectionEnd;
  const text = input.value;
  
  console.log('Current text:', text); // Debug log
  console.log('Selection:', start, end); // Debug log
  
  input.value = text.substring(0, start) + emoji + text.substring(end);
  input.selectionStart = input.selectionEnd = start + emoji.length;
  input.focus();
  
  console.log('New value:', input.value); // Debug log
  
  // Don't close the emoji picker - allow multiple emoji selections
  autoResize(input);
}

// ── UTILS ──
function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
}

function goBack() {
  window.location.href = '/chat/room/';
}

// Close emoji picker when clicking outside
document.addEventListener('click', (event) => {
  const picker = document.getElementById('emoji-picker');
  const emojiBtn = event.target.closest('.emoji-btn');
  
  if (!picker.contains(event.target) && !emojiBtn) {
    picker.classList.remove('show');
  }
});
