<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💌 Just Us</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --rose: #e8789a;
    --rose-dark: #c4567a;
    --rose-glow: rgba(232,120,154,0.18);
    --gold: #e8c87a;
    --bg: #0d0a0f;
    --bg2: #161118;
    --bg3: #1e1525;
    --surface: #221929;
    --surface2: #2a1f33;
    --text: #f0e8f0;
    --text2: #a892b4;
    --text3: #6b5578;
    --border: rgba(232,120,154,0.12);
    --shadow: 0 4px 32px rgba(0,0,0,0.6);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  /* ── SCREENS ── */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; transition: opacity 0.4s, transform 0.4s; }
  .screen.hidden { opacity: 0; pointer-events: none; transform: translateY(20px); }

  /* ── SPLASH / NAME ENTRY ── */
  #splash {
    background: var(--bg);
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .splash-art {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .petal {
    position: absolute;
    width: 6px;
    height: 10px;
    background: var(--rose);
    border-radius: 50% 50% 50% 0;
    opacity: 0;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0%   { opacity: 0; transform: translateY(-20px) rotate(0deg); }
    10%  { opacity: 0.5; }
    90%  { opacity: 0.2; }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg) translateX(40px); }
  }

  .splash-inner {
    position: relative;
    z-index: 1;
    text-align: center;
    width: 100%;
    max-width: 360px;
  }

  .heart-logo {
    font-size: 3.5rem;
    margin-bottom: 0.5rem;
    display: block;
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .splash-title {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    color: var(--rose);
    margin-bottom: 0.3rem;
    letter-spacing: -0.5px;
  }

  .splash-sub {
    font-size: 0.85rem;
    color: var(--text3);
    margin-bottom: 2.5rem;
    font-style: italic;
  }

  .name-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 20px;
    padding: 1.8rem;
    margin-bottom: 1.2rem;
    text-align: left;
  }

  .name-card label {
    font-size: 0.75rem;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    display: block;
    margin-bottom: 0.6rem;
  }

  .name-input {
    width: 100%;
    background: var(--bg3);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 0.85rem 1rem;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .name-input:focus {
    border-color: var(--rose);
  }

  .name-input::placeholder { color: var(--text3); }

  .avatar-row {
    display: flex;
    gap: 0.6rem;
    margin-top: 0.8rem;
    flex-wrap: wrap;
  }

  .av-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: var(--bg3);
    cursor: pointer;
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, transform 0.15s;
  }

  .av-btn:active { transform: scale(0.92); }
  .av-btn.selected { border-color: var(--rose); }

  .start-btn {
    width: 100%;
    padding: 1rem;
    background: linear-gradient(135deg, var(--rose-dark), var(--rose));
    border: none;
    border-radius: 14px;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: opacity 0.2s, transform 0.15s;
  }

  .start-btn:active { opacity: 0.85; transform: scale(0.98); }

  /* Toast */
  .toast {
    position: fixed;
    top: 1.2rem;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 999px;
    padding: 0.5rem 1.2rem;
    font-size: 0.82rem;
    color: var(--text2);
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── SUBTLE CREDITS ── */
  .credits {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 0.8rem;
    padding: 1rem;
  }

  .credits-name {
    color: rgba(255,255,255,0.6);
    font-weight: 500;
  }

  .credits-heart {
    color: rgba(255,107,107,0.7);
    animation: heartbeat 2s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .credits-year {
    color: rgba(78,205,196,0.7);
    font-weight: 500;
  }
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- SPLASH SCREEN -->
<div class="screen" id="splash">
  <div class="splash-art" id="petals-container"></div>
  <div class="splash-inner">
    <span class="heart-logo">💌</span>
    <h1 class="splash-title">Just Us</h1>
    <p class="splash-sub">your private little world</p>

    <div class="name-card">
      <label>Your Name</label>
      <input class="name-input" id="name-input" placeholder="How should I call you?" maxlength="20" autocomplete="off">
      <div class="avatar-row" id="avatar-row">
        <button class="av-btn selected" data-emoji="🌹" onclick="pickAv(this)">🌹</button>
        <button class="av-btn" data-emoji="💫" onclick="pickAv(this)">💫</button>
        <button class="av-btn" data-emoji="🦋" onclick="pickAv(this)">🦋</button>
        <button class="av-btn" data-emoji="🌙" onclick="pickAv(this)">🌙</button>
        <button class="av-btn" data-emoji="✨" onclick="pickAv(this)">✨</button>
        <button class="av-btn" data-emoji="🔥" onclick="pickAv(this)">🔥</button>
        <button class="av-btn" data-emoji="💎" onclick="pickAv(this)">💎</button>
        <button class="av-btn" data-emoji="🫶" onclick="pickAv(this)">🫶</button>
      </div>
    </div>

    <button class="start-btn" onclick="goToRoom()">Continue →</button>
  </div>
</div>

<script>
// ── STATE ──
const state = {
  myName: '',
  myAvatar: '🌹',
  roomCode: '',
};

// ── PETALS ──
(function spawnPetals() {
  const c = document.getElementById('petals-container');
  const colors = ['#e8789a','#c4567a','#e8c87a','#f0afc4'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    const left = Math.random() * 100;
    const dur = 5 + Math.random() * 8;
    const delay = -Math.random() * 10;
    const color = colors[Math.floor(Math.random() * colors.length)];
    p.style.cssText = `left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s;background:${color};opacity:0;width:${4+Math.random()*6}px;height:${7+Math.random()*8}px;`;
    c.appendChild(p);
  }
})();

// ── AVATAR PICKER ──
function pickAv(btn) {
  document.querySelectorAll('.av-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  state.myAvatar = btn.dataset.emoji;
}

// ── NAVIGATION ──
function goToRoom() {
  const n = document.getElementById('name-input').value.trim();
  if (!n) { showToast('Please enter your name 💕'); return; }
  state.myName = n;
  
  // Save to session and redirect to room screen
  fetch(`/chat/save_session/?name=${encodeURIComponent(state.myName)}&avatar=${encodeURIComponent(state.myAvatar)}`)
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      window.location.href = '/chat/room/';
    } else {
      showToast('Error saving session');
    }
  });
}

// ── UTILS ──
function showToast(msg, dur = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
</script>

<!-- SUBTLE CREDITS -->
<div class="credits">
  <span>© </span>
  <span class="credits-year">2026</span>
  <span> Developed with </span>
  <span class="credits-heart">❤️</span>
  <span> by </span>
  <span class="credits-name">Dreamer</span>
</div>

</body>
</html>
